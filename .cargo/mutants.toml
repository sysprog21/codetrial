# Functions the mutation gate cannot judge, because `cargo test` cannot reach
# them. Matched against the mutant names that `cargo mutants --list` prints.
#
# `run_room` is the agent's async loop: it joins a LiveKit room, drives Gemini,
# and returns when the interview ends. Nothing in `cargo test` starts a LiveKit
# server, so every mutant in it survives, including replacing the whole body
# with `Ok(())`. That is a true report and a useless one -- the gate would go
# red for any change touching a line inside it, which is how a gate gets
# ignored. What covers this path is the browser interview check and
# scripts/browser-check.sh, not unit tests.
#
# `open_session` is the first half of `run_room`, split out of it: it joins the
# room, waits for a candidate, brings up the audio track and the Gemini session,
# and greets. Every line of it needs a LiveKit server for the same reason the
# loop below it does, so `Ok(None)`, which reads as "nobody joined", survives
# exactly as `run_room`'s own mutants did. Excluded for the same reason and
# covered by the same thing: scripts/browser-check.sh in its credentialed modes.
#
# `run_gemini_check` is the same shape one layer down: it opens a Gemini Live
# session against Google and closes it. Replacing the body with `Ok(())` cannot
# be caught by `cargo test`, because a test that reached the real thing would
# need a live API key and would fail on a machine without one. What this mode
# actually proves is checked by running it, which is why `make check` does.
#
# `web_router` is a different case: its mutants die immediately rather than
# surviving. Replacing the constructor with an empty router answers 404 for
# every route, so whichever web test runs first catches it. It is here because
# the gate rebuilds and relinks a crate that statically links libwebrtc once
# per mutant, and this is the most expensive one in the tree to learn nothing
# from. It appears whenever a single line inside that hundred-line constructor
# changes.
#
# `run_livekit` is the `run-livekit` mode: it resolves the provider for a room
# name and then hands the whole interview to `run_room`. Replacing its body with
# `Ok(())` survives for the reason `run_room`'s mutants do, because reaching a
# single line of it needs a LiveKit server that `cargo test` never starts. It
# entered the diff when `select_provider` lost its `strict` argument, which is
# how a function nothing can test came to be scored.
#
# `handle_data_packet` and `handle_gemini_event` are the body of `run_room`'s
# loop, lifted out of it when that function was split. Both take `&Room` and
# answer by publishing on it, so every mutant in them is the `run_room` case
# under a new name: deleting a field from a `DataPacket`, or an arm that
# decides what to do with a Gemini event, cannot be observed without a room to
# publish into. They entered the diff by being moved, not by being written,
# which is how code nothing can test came to be scored. The decisions they make
# before they publish are tested: `apply_data_event` in tests/agent.rs, and
# `checklist_changed` beside it in livekit.rs.
#
# `publish_output_audio` and `output_audio_worker` are the two ends of playout.
# The first publishes a track to a room. The second hands frames to a
# `NativeAudioSource`, which is libwebrtc: it returns nothing a test can read,
# so replacing the worker with nothing at all looks the same from outside as
# playing the audio. What can be checked is checked, in `OutputAudio::capture`,
# which is where the framing and the playout pacing are decided.
#
# The rest of the room loop's helpers are here for the same reason: every one
# of them takes `&Room` or the live Gemini session and answers by writing to it.
# `publish_framework_progress`, `send_wrap_up_and_wait`, `drop_stale_playout`
# and `close_turns` publish; `generate_report` and the two transport functions
# under it post to Google and would need an API key to reach a single line.
# What they decide before they write is tested on its own: `close_turn` and
# `checklist_changed` in livekit.rs, `browser_packet` beside them, and
# `parse_and_validate_report` in gemini.rs, which is the half of report
# generation that does not need a network.
#
# `open_live_session_at` is in the list for a different reason from everything
# else here, and a smaller one: it is reachable, and `open_live_session_sends_
# setup_and_waits_for_setup_complete` drives it against a local socket. It
# generates one mutant, `Ok(Default::default())`, which cannot compile because
# `GeminiLiveSession` owns a socket and has no `Default`. Listing it spends a
# link per run to learn that again.
#
# `open_cold_session` is the retry around opening one, and the same case: every
# line of it is a socket to Google or the sleep between two of them, and what it
# decides in between is `take_restart_attempt`, which is tested.
#
# `restart_after_close` is the arm of the loop that puts the interview back on a
# new Gemini socket. Every line of it either opens a socket to Google or writes
# to a LiveKit room, so `Ok(ControlFlow::Continue(()))` looks the same from
# outside as doing the work, for the reason `run_room` itself does. The one
# decision it makes that is not a network call is `take_restart_attempt`, which
# is a counter and a duration and is tested beside it.
#
# `leave_room` and `publish_interviewer_state` are its two writes, and the same
# case as `publish_framework_progress` above: one disconnects the agent and the
# other publishes a packet, and a test with no room cannot tell either from a
# no-op. What `publish_interviewer_state` builds is `browser_packet`, which is
# tested.
#
# `report_packet` is `generate_report` with a timeout and an envelope around
# it, so reaching any line of it means posting to Google with a real key. What
# it builds is `browser_packet`, which is tested, and what it validates is
# `parse_and_validate_report`, which is tested; the wait in between is the part
# that needs the network.
#
# `publish_report` is the two lines around `report_packet`: it takes `&Room` and
# publishes what that returns, so `Ok(())` looks the same from outside as
# publishing, exactly as `publish_interviewer_state` above does. It belonged
# here as soon as `report_packet` did and was missed because both lived in
# `livekit.rs`, where `report_packet`'s own entry already covered the pair;
# splitting `src/livekit/report.rs` out scored the wrapper on its own.
#
# The media helpers are the same shape one layer down. `handle_media_event`
# and `attach_audio` take a LiveKit participant, `next_audio_frame` and
# `next_video_frame` poll a track, and `pump_video` and
# `encode_video_frame_jpeg_off_thread` need a subscribed video track to have
# anything to do. Their decisions are tested where they are made:
# `is_interview_participant`, `candidate_video_frames_go_to_gemini`,
# `should_send_video_frame`, `frame_to_rgba` and `encode_rgba_jpeg`.
#
# Keep this list short and each entry justified. An entry that is really "we
# never got around to testing this" belongs in a test, not here.
exclude_re = [
    "run_room",
    "open_session",
    "run_gemini_check",
    "run_livekit",
    "replace web_router",
    "handle_data_packet",
    "handle_gemini_event",
    "publish_output_audio",
    "output_audio_worker",
    "publish_framework_progress",
    "send_wrap_up_and_wait",
    "drop_stale_playout",
    "close_turns",
    "generate_report",
    "report_packet",
    "publish_report",
    "restart_after_close",
    "open_cold_session",
    "open_live_session_at",
    "leave_room",
    "publish_interviewer_state",
    "handle_media_event",
    "attach_audio",
    "next_audio_frame",
    "next_video_frame",
    "pump_video",
    "encode_video_frame_jpeg_off_thread",
]
