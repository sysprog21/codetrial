[package]
name = "codetrial"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

# The gate already runs `cargo clippy -- -D warnings`, and an editor running a
# bare `cargo clippy` used to disagree with it: warnings there, a red gate here,
# and the difference only visible after a push. Stating the level in the
# manifest makes every caller agree, the gate included.
#
# `unsafe_code` is forbidden rather than denied. There is none in this crate --
# every match for the word is a Content-Security-Policy string or a comment --
# and `forbid` is what stops a local `#[allow]` from quietly reintroducing it.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "query", "tokio"] }
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
jpeg-encoder = "0.7.1"
livekit = { version = "0.9.3", features = ["rustls-tls-webpki-roots"] }
ring = "0.17.14"
# Mozilla's roots compiled in, for this client and the Gemini WebSocket below
# alike, so the binary verifies every host it talks to without asking the
# machine for a CA store: docs/install.md promises nothing is required beyond
# the binary. The trade is that a CA an organization installs locally, a
# TLS-inspecting proxy's for one, is not trusted.
#
# reqwest, tokio-tungstenite and tower-http stay on the majors LiveKit depends
# on, so each builds once; .github/dependabot.yml holds them there.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7.19"
tower-http = { version = "0.6.11", default-features = false, features = ["compression-gzip"] }
tree-sitter = "=0.27.0"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"

# Only the tests need these. `chrono` and `livekit-protocol` unify with
# LiveKit; HMAC and SHA-256 remain independent fixture implementations.
#
# `chrono` parses the two RFC 3339 timestamps the recording acceptance compares
# and bounds the reader permission to 24 hours of delivery. `livekit-protocol`
# buys the generated `Deserialize`, which decodes an Egress request body exactly
# as the server does, so a hand-written body is checked against the real message
# instead of against a list of field names copied out of it.
[dev-dependencies]
# Independent implementations verify production signatures and digest fixtures.
hmac = "0.13.0"
sha2 = "0.11.0"
livekit-protocol = "0.8.0"
# The paused clock, so the Live socket's keepalive and idle limits are tested
# at their real values instead of waiting them out.
tokio = { version = "1.53.1", features = ["test-util"] }

# Release archives distribute the executable, not a debugging target. Cargo
# already omits debug information in this profile; omit linker symbols too.
#
# The trade is deliberate and worth stating, because it is not free: a panic
# backtrace out of a release archive is now hex addresses with no function
# names. `strip = "debuginfo"` would keep the symbol table, but debuginfo is
# already absent here, so it would buy nothing. Anyone chasing a crash builds
# without this or reproduces against a debug build.
[profile.release]
strip = "symbols"

# Dependencies are optimized even in a dev build, because `make serve` runs one
# and the agent's realtime path goes through them: the JPEG codec, the LiveKit
# SDK, TLS, protobuf. Unoptimized, one 720p frame took 138ms to encode against
# 6.8ms optimized, and that frame is encoded once a second while Gemini is
# mid-conversation.
#
# `debug-assertions` and `overflow-checks` off as well, because opt-level alone
# left most of the gap: 150ms, then 109ms with opt-level, then 54ms with these.
# The cost is that a dependency's own internal assertions stop firing here. That
# is an acceptable trade for third-party code this crate does not edit, and it
# does not reach this crate -- the override is `package."*"`, so codetrial keeps
# the dev defaults, assertions included.
#
# 54ms is still eight times the release figure, and chasing the rest (opt-level
# 3, codegen-units) costs a full dependency rebuild for less than this bought.
# It stops mattering at that point regardless: the encode runs on a blocking
# thread now, so what is left no longer stalls the executor.
#
# Only the dependencies, so a rebuild after an edit costs what it did before.
# They are built once and cached; the price is a single slower first build.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
overflow-checks = false

# `cargo test` builds under the test profile, which does not inherit the package
# override above, so the same line is needed here or the suite measures an
# unoptimized codec that no deployment runs.
[profile.test.package."*"]
opt-level = 2
debug-assertions = false
overflow-checks = false

# Exempted from the two overrides above, which are about codec speed and have
# nothing to say about a crate that only reads files. `rust-embed` splits on
# `debug_assertions` to decide whether assets live in `.rodata` or are read from
# disk, and it splits twice: once in the derived code, which sees this crate's
# setting, and once in the library, which sees its own. Turning it off for
# dependencies alone makes the two disagree, and the build fails on a
# `Filenames::Dynamic` the library compiled away.
#
# Forcing agreement here rather than with the `debug-embed` feature, which is
# the other way to make both sides pick the same branch. That way costs 38 MB of
# `__const` in every one of the eleven test binaries, measured, and again on
# every cargo-mutants rebuild, which is the exact link time the profile settings
# above exist to buy back. Release builds embed either way: `debug_assertions`
# is off there, and no feature is involved.
[profile.dev.package.rust-embed]
debug-assertions = true

[profile.test.package.rust-embed]
debug-assertions = true
