version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Separate groups so a failure in one does not hold back the rest: a
    # LiveKit release can raise the Clang floor in scripts/fetch-clang.sh, and
    # a tree-sitter grammar has to stay within the runtime's ABI range and the
    # version named in docs/evidence-runtime.md.
    #
    # Security updates otherwise arrive one crate per pull request; only the
    # coupled sets are grouped for them too. Nothing is ignored, because an
    # ignore rule also suppresses security pull requests; a bump past a crate
    # under vendor/ fails the vendor-patches gate in scripts/test.sh instead.
    groups:
      livekit:
        patterns:
          - "livekit*"
          - "webrtc-sys*"
      tree-sitter:
        patterns:
          - "tree-sitter*"
      rust:
        patterns:
          - "*"
      livekit-security:
        applies-to: security-updates
        patterns:
          - "livekit*"
          - "webrtc-sys*"
      tree-sitter-security:
        applies-to: security-updates
        patterns:
          - "tree-sitter*"
  # The desktop app's own lockfile. Tauri and its plugins are pinned exactly in
  # desktop/Cargo.toml, so they move only when that file is edited on
  # purpose; this keeps everything beneath them current, in one group so the
  # GTK and WebView crates that have to agree move together.
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      desktop:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
