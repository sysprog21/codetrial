# The desktop app's installers, built on the three platforms they are for.
#
# A workflow of its own so an installer failure (a bundler, a web view) does
# not hold the CLI's release back. A push to main refreshes the rolling
# `desktop-latest` release, as check.yml's `build` does for `latest`, and a
# `desktop-v*` tag cuts a versioned one. The CLI's `latest` is untouched.
#
# Pull requests run it only when the desktop app itself changed, because each
# leg builds the server in release mode as well as the app around it. A change
# to the server's side of the launch contract is still caught on Linux: the
# check job's Rust lane compiles and tests desktop/ on every run. A push to
# main skips only documentation, since the server inside every installer is
# built from that commit.
name: desktop

on:
  pull_request:
    paths:
      - desktop/**
      - scripts/desktop-smoke.sh
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

env:
  # The CLI that bundles, pinned like every other tool the workflows run. Kept
  # on the same minor as the `tauri` crate in desktop/Cargo.toml.
  TAURI_CLI_VERSION: 2.12.3

jobs:
  package:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than the 24.04 the gates use: the bundle links the
          # WebKitGTK it is built against, and the oldest one an installer
          # should still start on is the floor. 22.04 is the first Ubuntu with
          # WebKitGTK 4.1, which Tauri 2 requires.
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: ''
            bundles: deb,rpm,appimage
            pr_bundles: deb
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            extension: ''
            bundles: app,dmg
            pr_bundles: dmg
          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            extension: .exe
            bundles: msi,nsis
            pr_bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: libglib2.0-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev file xvfb
      - name: Install WebRTC C++ compiler
        if: runner.os == 'Linux'
        uses: ./.github/actions/webrtc-clang

      - name: Install Rust
        run: rustup toolchain install --target ${{ matrix.target }}
      # Saved from main only. Each platform's entry is 640 to 910 MB, a pull
      # request's copy is readable by that pull request alone, and the
      # repository's 10 GB limit was full: one desktop pull request wrote
      # 2.2 GB that evicted the entries main's runs restore.
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            desktop -> target/desktop

      # The server embeds the page and its vendored runtimes, so the same
      # fetch and check the CLI release makes, for the same reason: a missing
      # asset compiles into a server that boots and then strands the candidate.
      - name: Prepare browser assets for embedding
        uses: ./.github/actions/prepare-vendor

      # The flags check.yml's release build passes, for the reasons it gives:
      # a static CRT on Windows, and `-ObjC` so WebRTC's Objective-C categories
      # survive the link on macOS. Here and not job-wide, because they are the
      # server's and the app around it links without them.
      - name: Build the server
        shell: bash
        env:
          RUSTFLAGS: >-
            ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static'
                || contains(matrix.target, '-apple-') && '-Clink-arg=-ObjC'
                || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Where tauri.bundle.json's `externalBin` looks: the name Tauri expects
      # carries the target triple, and the installer drops it again.
      - name: Place the server beside the app
        shell: bash
        run: |
          mkdir -p target/desktop/sidecar
          cp target/${{ matrix.target }}/release/codetrial${{ matrix.extension }} \
            target/desktop/sidecar/codetrial-${{ matrix.target }}${{ matrix.extension }}

      # A pull request builds one installer per platform, which is enough to
      # prove the bundle config still packages; each further format downloads
      # its own packaging tool on every run.
      #
      # `NO_STRIP`, because the AppImage tool's own strip is older than the
      # toolchain and fails on sections it does not know. Both programs are
      # already stripped by their release profiles, so nothing is lost.
      #
      # `hdiutil` on the macOS runners sometimes fails with "Resource busy"
      # while it creates the disk image. Only that failure is built again; any
      # other one stops the step on the first attempt.
      - name: Build the installers
        working-directory: desktop
        shell: bash
        env:
          NO_STRIP: 'true'
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/tauri-build.log"
          for attempt in 1 2 3; do
            if npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --ci \
              --target ${{ matrix.target }} \
              --bundles ${{ github.event_name == 'pull_request' && matrix.pr_bundles || matrix.bundles }} \
              --config tauri.bundle.json 2>&1 | tee "$log"; then
              exit 0
            fi
            grep -q 'hdiutil.*Resource busy' "$log" || exit 1
            [ "$attempt" -lt 3 ] || exit 1
            echo "hdiutil was busy; building again (attempt $attempt of 3)"
            sleep 10
          done

      # The built app, not the installer, but with the server beside it the
      # way every installer puts it.
      - name: Start the app, then kill it
        shell: bash
        run: |
          app=target/desktop/${{ matrix.target }}/release/codetrial-desktop${{ matrix.extension }}
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a sh scripts/desktop-smoke.sh "$app"
          else
            sh scripts/desktop-smoke.sh "$app"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: codetrial-desktop-${{ matrix.target }}
          if-no-files-found: error
          # The installers are already compressed, and a push to main hands
          # them to `rolling` within minutes. Re-running a release job after
          # the week needs the package jobs re-run first.
          compression-level: 0
          retention-days: 7
          path: |
            target/desktop/${{ matrix.target }}/release/bundle/deb/*.deb
            target/desktop/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/desktop/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/desktop/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/desktop/${{ matrix.target }}/release/bundle/msi/*.msi
            target/desktop/${{ matrix.target }}/release/bundle/nsis/*.exe

  # Rolling `desktop-latest` prerelease for main, the counterpart of
  # check.yml's `latest` and the same draft-then-swap, so keep the two in step.
  # Not marked Latest, so the CLI's release keeps that badge. It does not wait
  # for check.yml's gates, because a job cannot `needs` another workflow; the
  # next green commit replaces a bad one.
  rolling:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-desktop-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: codetrial-desktop-*
          path: dist
          merge-multiple: true
      - name: Verify and publish the desktop-latest release
        shell: bash
        run: |
          # One installer of each kind a platform is for, by extension, since
          # the file names carry the version.
          for ext in deb rpm AppImage dmg msi exe; do
            compgen -G "dist/*/*.$ext" >/dev/null || {
              echo "missing release asset: *.$ext" >&2
              exit 1
            }
          done
          assets=(dist/*/*)

          tag=desktop-latest
          superseded() {
            # An API failure stops the job; it is not read as "superseded".
            tip=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha) || exit 1
            [ "$tip" != "$GITHUB_SHA" ] && echo "superseded by $tip; leaving $tag as it is"
          }
          # Before the upload, so an overtaken build skips it.
          if superseded; then exit 0; fi
          staged="staging-desktop-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          published=false
          trap '[ "$published" = true ] || gh release delete "$staged" --yes >/dev/null 2>&1 || true' EXIT

          gh release create "$staged" --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "CodeTrial desktop (main)" \
            --notes "Automated desktop build of ${GITHUB_SHA:0:7}. The installers are not signed yet; docs/desktop.md lists what that means on each platform."
          # An upload can time out (HTTP 408) on the GitHub side with nothing
          # wrong in the build. --clobber replaces an asset a cut-off attempt
          # left behind, so trying again is safe.
          for attempt in 1 2 3; do
            gh release upload --clobber "$staged" "${assets[@]}" && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "upload failed; trying again (attempt $attempt of 3)" >&2
            sleep $((attempt * 10))
          done

          # Sizes, not just presence: a cut-off upload still leaves a named
          # asset behind.
          sizes=$(gh release view "$staged" --json assets --jq '.assets[] | "\(.name) \(.size)"')
          for asset in "${assets[@]}"; do
            name=$(basename "$asset")
            want=$(stat -c%s "$asset")
            got=$(printf '%s\n' "$sizes" | awk -v n="$name" '$1 == n { print $2 }')
            [ "$want" = "$got" ] || {
              echo "$name uploaded as ${got:-nothing}, expected $want bytes" >&2
              exit 1
            }
          done

          # Again as late as possible: a re-run of an older commit, or a build
          # overtaken meanwhile, must not walk the pointer backwards.
          if superseded; then exit 0; fi

          # One release per tag, and the release and the tag go missing
          # separately, so each is removed on its own and only if it exists.
          releases=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if printf '%s\n' "$releases" | grep -qxF "$tag"; then
            gh release delete "$tag" --yes
          fi
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')
          if printf '%s\n' "$refs" | grep -qxF "refs/tags/$tag"; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" --silent
          fi

          gh release edit "$staged" --tag "$tag" --target "$GITHUB_SHA" --draft=false --prerelease --latest=false
          published=true

  # A tag names a version, and the version is the one desktop/Cargo.toml
  # says: an installer reporting 0.1.0 under a desktop-v0.2.0 release is the
  # mismatch this refuses before anything is published.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: codetrial-desktop-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        shell: bash
        run: |
          tag=${GITHUB_REF#refs/tags/}
          version=$(sed -n 's/^version *= *"\([^"]*\)"$/\1/p' desktop/Cargo.toml | head -n 1)
          [ "$tag" = "desktop-v$version" ] || {
            echo "tag $tag does not match desktop/Cargo.toml version $version" >&2
            exit 1
          }
          ls dist/*
          cat > notes.md <<EOF
          Desktop build of ${GITHUB_SHA:0:7}. The installers are not signed yet.

          - macOS: the first launch is refused as from an unidentified developer.
            Allow it under System Settings, Privacy & Security, Open Anyway.
          - Windows: SmartScreen warns before the first launch.
          - Linux: needs WebKitGTK 4.1. Where that WebKitGTK is built without
            WebRTC, the interview opens in the default browser and the app keeps
            its server running.

          docs/desktop.md describes what the app does and what it has not been
          qualified for yet.
          EOF
          gh release create "$tag" --prerelease --verify-tag \
            --title "CodeTrial desktop $version" --notes-file notes.md dist/*/*
