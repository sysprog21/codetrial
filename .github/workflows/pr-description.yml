# Keep the interactive review block in a pull request description honest.
#
# check.yml cannot re-run on every description edit without paying for the whole
# matrix, so this one carries only the description check. It compares what the
# description declares with what the diff requires; the review itself is local
# evidence this job never sees.
#
# It runs on pull_request_target, so the workflow that runs is the base branch's
# and a pull request cannot edit or remove it. The same reason makes this job
# the dangerous kind: it has the base repository's token. It therefore asks for
# read access only, checks the pull request out as data, and runs only the base
# branch's checker, never a script from the pull request. While the base has no
# gate (the pull request that adds it) there is nothing to compare, and this
# workflow does not exist on the base either until that pull request merges.
# Changing the trigger or the token's scope needs the review that
# .claude/skills/codetrial-triage/apply-pr-actions.sh names for this file.
name: pr-description

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  interactive-review:
    # Dependabot cannot run the hooks or fill in the description.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: head
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: base
      - name: Compare the description with the diff
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          export GIT_TERMINAL_PROMPT=0
          if [ ! -f base/scripts/check-interactive-review.py ] \
              || [ ! -f base/.claude/skills/codetrial-review/commit-sizes.py ]; then
              echo "The base branch has no interactive review gate yet; nothing to compare."
              exit 0
          fi
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/description.md"
          cd head
          python3 ../base/scripts/check-interactive-review.py pr-body \
              --base "$BASE_SHA" --head "$HEAD_SHA" \
              --body-file "$RUNNER_TEMP/description.md"
